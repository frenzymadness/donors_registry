[tox]
envlist = lint,py{313}
skipsdist = True

[testenv]
deps = -rrequirements/dev.txt
commands = python -m pytest -v {posargs} tests/

[testenv:py313]
commands =
  coverage run -m pytest -v {posargs} tests/
  coverage report

[testenv:lint]
basepython = python3.13
deps = -rrequirements/lint.txt
commands =
  pre-commit run --all-files --show-diff-on-failure

[testenv:deps]
basepython = python3.13
allowlist_externals = rm
deps = uv
commands =
  uv pip compile --upgrade --generate-hashes --output-file=requirements/prod.txt requirements/prod.in
  uv pip compile --upgrade --generate-hashes --output-file=requirements/dev.txt requirements/dev.in
  uv pip compile --upgrade --generate-hashes --output-file=requirements/extra.txt requirements/extra.in
  uv pip compile --upgrade --generate-hashes --output-file=requirements/lint.txt requirements/lint.in
